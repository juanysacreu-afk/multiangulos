<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich Indigo to Deep Midnight Violet -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Top-Left Rim Light -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 3D Drop Shadow for the Cube -->
    <filter id="cubeShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#090d16" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- App Squircle Base (App Store / PWA Style) -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#rimGrad)" stroke-width="2" />

  <!-- Ambient Internal Glow behind Cube -->
  <circle cx="64" cy="62" r="38" fill="#818CF8" opacity="0.28" filter="url(#softGlow)" />

  <!-- Playful Decorative Sparkles in the Sky -->
  <path d="M 106 20 Q 106 26 112 26 Q 106 26 106 32 Q 106 26 100 26 Q 106 26 106 20 Z" fill="#FDE047" opacity="0.95" />
  <circle cx="22" cy="28" r="2" fill="#38BDF8" opacity="0.8" />
  <circle cx="106" cy="100" r="2.5" fill="#34D399" opacity="0.8" />

  <!-- 3D Isometric Multiplication Master Block (2x2 on each visible face) -->
  <g filter="url(#cubeShadow)">
    <!-- ==================== TOP FACE (GOLDEN AMBER 2x2) ==================== -->
    <!-- Tile 0,0 (Back) -->
    <path d="M 64 20 L 80 29.5 L 64 39 L 48 29.5 Z" fill="#FEF08A" />
    <!-- Tile 0,1 (Right) -->
    <path d="M 80 29.5 L 96 39 L 80 48.5 L 64 39 Z" fill="#FDE047" />
    <!-- Tile 1,0 (Left) -->
    <path d="M 48 29.5 L 64 39 L 48 48.5 L 32 39 Z" fill="#FBBF24" />
    <!-- Tile 1,1 (Center/Front) -->
    <path d="M 64 39 L 80 48.5 L 64 58 L 48 48.5 Z" fill="#F59E0B" />

    <!-- ==================== LEFT FACE (SKY BLUE & CYAN 2x2) ==================== -->
    <!-- Tile 0,0 (Top Left) -->
    <path d="M 32 39 L 48 48.5 L 48 68.5 L 32 59 Z" fill="#38BDF8" />
    <!-- Tile 0,1 (Top Right) -->
    <path d="M 48 48.5 L 64 58 L 64 78 L 48 68.5 Z" fill="#0EA5E9" />
    <!-- Tile 1,0 (Bottom Left) -->
    <path d="M 32 59 L 48 68.5 L 48 88.5 L 32 79 Z" fill="#0284C7" />
    <!-- Tile 1,1 (Bottom Right) -->
    <path d="M 48 68.5 L 64 78 L 64 98 L 48 88.5 Z" fill="#0369A1" />

    <!-- ==================== RIGHT FACE (EMERALD & MINT 2x2) ==================== -->
    <!-- Tile 0,0 (Top Left) -->
    <path d="M 64 58 L 80 48.5 L 80 68.5 L 64 78 Z" fill="#34D399" />
    <!-- Tile 0,1 (Top Right) -->
    <path d="M 80 48.5 L 96 39 L 96 59 L 80 68.5 Z" fill="#10B981" />
    <!-- Tile 1,0 (Bottom Left) -->
    <path d="M 64 78 L 80 68.5 L 80 88.5 L 64 98 Z" fill="#059669" />
    <!-- Tile 1,1 (Bottom Right) -->
    <path d="M 80 68.5 L 96 59 L 96 79 L 80 88.5 Z" fill="#047857" />

    <!-- ==================== SEPARATION GROOVES (CLEAN WHITE EDGES) ==================== -->
    <!-- Top Face Grid Grooves -->
    <line x1="32" y1="39" x2="96" y2="39" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.8" />
    <line x1="48" y1="29.5" x2="80" y2="48.5" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.8" />
    <!-- Left Face Grid Grooves -->
    <line x1="32" y1="59" x2="64" y2="78" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.8" />
    <line x1="48" y1="48.5" x2="48" y2="88.5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.8" />
    <!-- Right Face Grid Grooves -->
    <line x1="64" y1="78" x2="96" y2="59" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.8" />
    <line x1="80" y1="48.5" x2="80" y2="88.5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.8" />

    <!-- External Cube Edges (Crisp Definition) -->
    <path d="M 64 20 L 96 39 L 96 79 L 64 98 L 32 79 L 32 39 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />
    <line x1="64" y1="58" x2="64" y2="98" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
    <line x1="64" y1="58" x2="32" y2="39" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
    <line x1="64" y1="58" x2="96" y2="39" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Glossy Specular Light Ribbon on Top-Left Bevel -->
    <path d="M 33 39 L 64 21 L 64 24 L 35 41 Z" fill="#FFFFFF" opacity="0.6" />

    <!-- Central Joyful 4-Point Star Sparkle on the Top Face -->
    <path d="M 64 34 Q 64 39 69 39 Q 64 39 64 44 Q 64 39 59 39 Q 64 39 64 34 Z" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>